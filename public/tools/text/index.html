(function (root) {
  'use strict';
  const defaults = Object.freeze({ mode: 'keep', spaces: true, blankLines: true, invisible: true });
  const horizontal = /[^\S\n]/gu;
  const structural = /^\s*(?:[-*+•‣▪◦]\s|\d+[.)]\s|[가-힣][.)]\s|#{1,6}\s|>\s?|```|~~~|\|)/u;

  function cleanText(input, options = {}) {
    const settings = { ...defaults, ...options };
    let text = String(input ?? '').replace(/\r\n?/g, '\n').replace(/\u2028/g, '\n').replace(/\u2029/g, '\n\n');
    if (settings.invisible) text = text.replace(/[\u200B\uFEFF]/g, '');
    if (settings.spaces) {
      text = text.split('\n').map(line => line.replace(horizontal, ' ').replace(/ +/g, ' ').trim()).join('\n');
      text = text.replace(/^\n+|\n+$/g, '');
    }
    if (settings.blankLines) text = text.replace(/\n(?:[^\S\n]*\n){2,}/gu, '\n\n');
    if (settings.mode === 'single') {
      text = text.replace(/[^\S\n]*\n(?:[^\S\n]*\n)*[^\S\n]*/gu, ' ');
      if (settings.spaces) text = text.trim();
    } else if (settings.mode === 'paragraphs') {
      const lines = text.split('\n');
      let joined = lines[0] ?? '';
      let fenced = /^\s*(?:```|~~~)/.test(lines[0] ?? '');
      for (let i = 1; i < lines.length; i += 1) {
        const previous = lines[i - 1];
        const current = lines[i];
        const boundary = fenced || !previous.trim() || !current.trim() || structural.test(previous) || structural.test(current);
        joined += (boundary ? '\n' : ' ') + current;
        if (/^\s*(?:```|~~~)/.test(current)) fenced = !fenced;
      }
      text = joined;
    }
    return text;
  }

  const api = { cleanText, defaults };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.PasteCleaner = api;
})(globalThis);

</script>
  <script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const source = $('source');
  const result = $('result');
  const copy = $('copy');
  const status = $('status');
  const modeHelp = {
    keep: '줄바꿈과 문단을 그대로 유지합니다.',
    paragraphs: '끊긴 줄을 잇고, 빈 줄로 나눈 문단과 목록은 유지합니다.',
    single: '모든 줄바꿈을 공백 하나로 바꿉니다.'
  };
  let hasResult = false;
  let previousInput = null;
  let copiedTimer;
  const charCount = text => [...text].length;
  const lineCount = text => text ? text.split(/\r\n?|\n/).length : 0;
  const format = text => `${charCount(text).toLocaleString('ko-KR')}자 · ${lineCount(text).toLocaleString('ko-KR')}줄`;
  const options = () => ({ mode: document.querySelector('input[name="mode"]:checked').value, spaces: $('spaces').checked, blankLines: $('blank-lines').checked, invisible: $('invisible').checked });
  const announce = message => { status.textContent = message; };

  function resetCopy() {
    clearTimeout(copiedTimer);
    $('copy-label').textContent = '결과 복사';
  }
  function inputChanged() {
    resetCopy();
    if (source.value) { previousInput = null; $('undo').hidden = true; }
    $('source-count').textContent = format(source.value);
    $('clean').disabled = source.value.length === 0;
    $('clear').disabled = source.value.length === 0;
    $('sample').disabled = source.value.length > 0;
    result.value = '';
    $('result-count').textContent = '0자 · 0줄';
    $('difference').textContent = '원문은 그대로 남아요';
    copy.disabled = true;
    $('result-state').textContent = source.value ? '정리해 주세요' : '준비됐어요';
    $('result-state').classList.toggle('stale', Boolean(source.value));
    hasResult = false;
    announce('');
  }
  function clean(shouldAnnounce = true) {
    resetCopy();
    if (!source.value) return;
    const cleaned = PasteCleaner.cleanText(source.value, options());
    result.value = cleaned;
    hasResult = true;
    $('source-count').textContent = format(source.value);
    $('result-count').textContent = format(cleaned);
    copy.disabled = cleaned.length === 0;
    const removed = Math.max(0, charCount(source.value) - charCount(cleaned));
    $('difference').textContent = removed ? `${removed.toLocaleString('ko-KR')}자 가벼워졌어요` : '불필요한 공백이 없어요';
    $('result-state').textContent = cleaned ? '정리 완료' : '남은 글이 없어요';
    $('result-state').classList.remove('stale');
    if (shouldAnnounce) announce(cleaned ? (source.value === cleaned ? '이미 깔끔한 글이에요. 그대로 복사할 수 있어요.' : '정리했어요. 원문과 비교한 뒤 복사하세요.') : '공백을 정리하니 남은 글이 없어요.');
  }

  source.addEventListener('input', inputChanged);
  source.addEventListener('keydown', event => {
    if ((event.metaKey || event.ctrlKey) && event.key === 'Enter' && !event.isComposing) {
      event.preventDefault();
      clean();
    }
  });
  $('clean').addEventListener('click', () => clean());
  document.querySelectorAll('input').forEach(input => input.addEventListener('change', () => {
    $('mode-help').textContent = modeHelp[options().mode];
    if (hasResult) clean();
  }));
  $('sample').addEventListener('click', () => {
    if (source.value) return;
    source.value = '  복사한 글에    공백이 많거나,\n줄이 중간에 끊겨 있나요?  \n\n\n  내용은 그대로 두고,   읽기 좋게 정리해요.\n\n- 원문은 그대로 보관\n- 정리 결과만 복사  ';
    inputChanged();
    clean();
  });
  $('clear').addEventListener('click', () => {
    if (!source.value) return;
    previousInput = source.value;
    source.value = '';
    inputChanged();
    $('undo').hidden = false;
    announce('비웠어요. 되돌리기로 원문을 복원할 수 있어요.');
    source.focus();
  });
  $('undo').addEventListener('click', () => {
    if (source.value || previousInput === null) return;
    source.value = previousInput;
    previousInput = null;
    $('undo').hidden = true;
    inputChanged();
    announce('원문을 복원했어요.');
    source.focus();
  });
  copy.addEventListener('click', async () => {
    if (copy.disabled || !result.value) return;
    const value = result.value;
    let success = false;
    try {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(value);
        success = true;
      }
    } catch (_) { /* A browser may require the manual fallback below. */ }
    if (!success) {
      result.focus();
      result.select();
      try { success = document.execCommand('copy'); } catch (_) { success = false; }
    }
    if (success) {
      $('copy-label').textContent = '복사했어요';
      announce('클립보드에 복사했어요. 원하는 곳에 붙여넣으세요.');
      copiedTimer = setTimeout(resetCopy, 2400);
    } else {
      announce('자동 복사를 할 수 없어요. 선택된 결과를 ⌘C 또는 Ctrl+C로 복사해 주세요.');
    }
  });
  if (!/Mac|iPhone|iPad/.test(navigator.platform)) $('shortcut').textContent = 'Ctrl ↵';
  inputChanged();
})();

</script>
</body>
</html>
